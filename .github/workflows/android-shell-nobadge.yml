name: Build Android Shell APK (no badge)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android-shell/**", ".github/workflows/android-shell-nobadge.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHELL_KEYSTORE_BASE64: ${{ secrets.SHELL_KEYSTORE_BASE64 }}
      SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_KEYSTORE_PASSWORD }}
      SHELL_KEY_ALIAS: ${{ secrets.SHELL_KEY_ALIAS }}
      SHELL_KEY_PASSWORD: ${{ secrets.SHELL_KEY_PASSWORD }}
      SHELL_SITE_URL: ${{ vars.SHELL_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Patch shell to block Netlify badge
        run: |
          python3 - <<'PY'
          import base64, sys
          path = "android-shell/app/src/main/java/app/floatphone/shell/MainActivity.kt"
          src = open(path, encoding="utf-8").read()
          if "/.netlify/scripts/" in src:
              print("already patched"); sys.exit(0)
          anchor = "webView.webViewClient = object : WebViewClient() {\n"
          if anchor not in src:
              print("::error::anchor not found"); sys.exit(1)
          block = base64.b64decode("").decode()
          if "shouldInterceptRequest" not in block:
              print("::error::patch payload corrupted"); sys.exit(1)
          open(path, "w", encoding="utf-8").write(src.replace(anchor, anchor + block, 1))
          print("patched")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11.1"

      - name: Decode keystore
        run: |
          if [ -z "$SHELL_KEYSTORE_BASE64" ]; then
            echo "::error::SHELL_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$SHELL_KEYSTORE_BASE64" | base64 -d > /tmp/shell.keystore
          echo "SHELL_KEYSTORE_FILE=/tmp/shell.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle -p android-shell assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: float-shell-release-nobadge
          path: android-shell/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
